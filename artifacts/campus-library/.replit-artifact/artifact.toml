kind = "web"
previewPath = "/"
title = "Campus Library"
description = "A college resource portal where students can discover exam materials, browse academic resources, and submit their own uploads for admin approval."
version = "1.0.0"
id = "artifacts/campus-library"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25578

[services.development]
run = "pnpm --filter @workspace/campus-library run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campus-library", "run", "build" ]
serve = "static"
publicDir = "artifacts/campus-library/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25578"
BASE_PATH = "/"
